# Move this file to .github/workflows/update-news.yml to enable automatic news refreshes.
# (Kept here because workflow files need a token with the "workflow" scope to be pushed.)
name: Update ski news
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python automation/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "eski-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/news.json
          git diff --cached --quiet || git commit -m "Auto-update ski news" && git push
